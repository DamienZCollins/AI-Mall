# RocketMQ Broker 单机配置
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

# 注册到 NameServer 的地址。宿主机应用通过 host.docker.internal 访问容器映射端口。
# Docker Desktop for Windows 会维护该域名到宿主机的解析。
brokerIP1 = host.docker.internal
