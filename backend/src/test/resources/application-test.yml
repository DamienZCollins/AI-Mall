# 测试用配置：只提供非空的连接参数，测试不依赖真实中间件
mall:
  jwt:
    secret: test-secret-for-context-load-at-least-32-bytes
    expire-minutes: 30
  storage:
    access-key: test
    secret-key: test
    init-bucket: false
  seckill:
    preheat-on-startup: false
    stock-reconcile-enabled: false
  embedding:
    base-url: http://localhost:1/v1
    api-key: test
    model: test-model
    dimensions: 1024

spring:
  datasource:
    username: test
    password: test
  # 单元测试与上下文测试不需要连接 Elasticsearch，指向不可达地址让初始化快速失败
  elasticsearch:
    uris: http://localhost:1
    connection-timeout: 1s
    socket-timeout: 1s
