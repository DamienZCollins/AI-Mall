spring:
  application:
    name: mall
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}

mall:
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
  storage:
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
    region: ${RUSTFS_REGION:us-east-1}
    bucket: ${RUSTFS_BUCKET_PRODUCT:mall-product}
    public-base-url: ${RUSTFS_PUBLIC_BASE_URL:http://localhost:9000/mall-product}
    init-bucket: ${RUSTFS_INIT_BUCKET:true}
  embedding:
    base-url: ${EMBEDDING_BASE_URL}
    api-key: ${EMBEDDING_API_KEY}
    model: ${EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
  search:
    index-alias: ${ELASTICSEARCH_INDEX_PRODUCT:mall_product}
    index-name: ${ELASTICSEARCH_INDEX_PRODUCT:mall_product}_v1
  rocketmq:
    endpoints: ${ROCKETMQ_PROXY_ENDPOINT:localhost:8081}
    order-topic: ${ROCKETMQ_SECKILL_ORDER_TOPIC:mall-seckill-order}
    timeout-topic: ${ROCKETMQ_SECKILL_TIMEOUT_TOPIC:mall-seckill-timeout}
    order-consumer-group: ${ROCKETMQ_ORDER_CONSUMER_GROUP:mall-seckill-order-consumer}
    timeout-consumer-group: ${ROCKETMQ_TIMEOUT_CONSUMER_GROUP:mall-seckill-timeout-consumer}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mall: debug
