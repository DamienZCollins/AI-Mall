name: mall

services:
  mysql:
    image: mysql:8.4
    container_name: mall-mysql
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - mall-net

  redis:
    image: redis:7.2
    container_name: mall-redis
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mall-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: mall-rocketmq-namesrv
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HEAP_OPTS: "-Xms256m -Xmx256m -Xmn128m"
    command: [ "sh", "mqnamesrv" ]
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9876'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mall-net

  rocketmq-broker-init:
    image: alpine:3.20
    container_name: mall-rocketmq-broker-init
    user: root
    command: [ "sh", "-c", "chown -R 3000:3000 /volumes/store" ]
    volumes:
      - rocketmq-broker-store:/volumes/store
    networks:
      - mall-net

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: mall-rocketmq-broker
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HEAP_OPTS: "-Xms512m -Xmx512m -Xmn256m"
    command: [ "sh", "mqbroker", "-c", "/home/rocketmq/rocketmq-5.3.2/conf/broker.conf", "-n", "rocketmq-namesrv:9876" ]
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_VIP_PORT:-10909}:10909"
      - "${ROCKETMQ_BROKER_HA_PORT:-10912}:10912"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq-broker-store:/home/rocketmq/store
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10911'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - mall-net

  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: mall-rocketmq-proxy
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HEAP_OPTS: "-Xms256m -Xmx256m"
    command: [ "sh", "mqproxy", "-n", "rocketmq-namesrv:9876" ]
    ports:
      - "${ROCKETMQ_PROXY_PORT:-8081}:8081"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - mall-net

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: mall-rocketmq-dashboard
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: "-Drocketmq.config.namesrvAddr=rocketmq-namesrv:9876 -Drocketmq.config.loginRequired=false"
    ports:
      - "${ROCKETMQ_DASHBOARD_PORT:-18080}:8082"
    networks:
      - mall-net

  elasticsearch:
    build:
      context: ./docker/elasticsearch
    image: mall/elasticsearch-ik:8.17.6
    container_name: mall-elasticsearch
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      cluster.name: mall-es
      node.name: mall-es-node
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - mall-net

  rustfs:
    image: rustfs/rustfs:latest
    container_name: mall-rustfs
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mall-net

volumes:
  mysql-data:
  redis-data:
  rocketmq-broker-store:
  elasticsearch-data:
  rustfs-data:

networks:
  mall-net:
    driver: bridge


